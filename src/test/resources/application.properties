spring.application.name=proxymed-test

# H2 en mode compatibilite PostgreSQL : les tests tournent sans Docker/Postgres.
# Le schema (Liquibase) et le mapping JPA restent identiques a la prod ; seul le
# moteur SQL change. A remplacer par Testcontainers+Postgres si une parite stricte
# avec la prod devient necessaire.
spring.datasource.url=jdbc:h2:mem:proxymed;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# "validate" est trop strict entre H2 (mode Postgres) et Hibernate sur les colonnes
# TEXT/CLOB ; Liquibase reste la seule source de verite du schema en test comme en prod.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.liquibase.change-log=classpath:db/changelogs/changelog-master.yaml

# Les tests d'integration partent de tables vides : on n'active aucun contexte des donnees
# seedees (donnees-initiales, test-data), seuls les changesets de schema (sans contexte) s'executent.
spring.liquibase.contexts=tests

# Un champ JSON inconnu (ex. "examenParAppareil" dans PUT /api/consultations/{id}, qui se gere
# via son endpoint dedie) doit etre rejete en 400 plutot qu'ignore silencieusement.
spring.jackson.deserialization.fail-on-unknown-properties=true
