spring.application.name=proxymed

spring.datasource.url=jdbc:postgresql://localhost:5432/proxymed
spring.datasource.username=proxymed
spring.datasource.password=proxymed
spring.datasource.driver-class-name=org.postgresql.Driver

# Le schema est gere par Liquibase, Hibernate se contente de le valider.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.liquibase.change-log=classpath:db/changelogs/changelog-master.yaml

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Un champ JSON inconnu (ex. "examenParAppareil" dans PUT /api/consultations/{id}, qui se gere
# via son endpoint dedie) doit etre rejete en 400 plutot qu'ignore silencieusement.
spring.jackson.deserialization.fail-on-unknown-properties=true
