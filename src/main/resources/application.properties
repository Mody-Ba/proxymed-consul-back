spring.application.name=proxymed

spring.datasource.url=jdbc:postgresql://localhost:5432/proxymed
spring.datasource.username=proxymed
spring.datasource.password=proxymed
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.liquibase.change-log=classpath:db/changelogs/changelog-master.yaml

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

spring.jackson.deserialization.fail-on-unknown-properties=true


spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
